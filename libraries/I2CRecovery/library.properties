name=I2CRecovery
version=1.0.0
author=Peter Rogers
maintainer=Peter Rogers <peterlightspeeder@gmail.com>
sentence=Recovers a locked I2C bus by manually clocking SCL and issuing a STOP condition.
paragraph=Fixes the common problem where an I2C slave (e.g. an SSD1306 OLED) is left mid-transaction after an upload/reset, holding SDA low and hanging the bus until power is removed. Call i2cRecoverBus() once at the top of setup(), before Wire.begin().
